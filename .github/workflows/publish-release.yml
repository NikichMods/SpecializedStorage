name: Publish Accepted Release

on:
  push:
    branches:
      - main
    paths:
      - 'release/accepted.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-accepted-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read accepted release manifest
        id: release
        shell: bash
        run: |
          set -euo pipefail
          manifest='release/accepted.json'
          for key in version tag title release_notes source_sha run_id artifact_name asset_name installed_asset_name sha256; do
            value="$(jq -r --arg key "$key" '.[$key]' "$manifest")"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "Missing release manifest field: $key" >&2
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Download exact accepted artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: release-asset
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.run_id }}

      - name: Verify accepted binary and prepare installed payload
        shell: bash
        run: |
          set -euo pipefail
          source="release-asset/${{ steps.release.outputs.asset_name }}"
          target="release-asset/${{ steps.release.outputs.installed_asset_name }}"
          test -f "$source"

          actual="$(sha256sum "$source" | awk '{print $1}')"
          expected='${{ steps.release.outputs.sha256 }}'
          if [ "$actual" != "$expected" ]; then
            echo "SHA-256 mismatch: expected $expected, got $actual" >&2
            exit 1
          fi

          cp "$source" "$target"
          copied="$(sha256sum "$target" | awk '{print $1}')"
          if [ "$copied" != "$expected" ]; then
            echo "Canonical payload SHA-256 mismatch after filename-only copy." >&2
            exit 1
          fi

      - name: Prepare release notes
        env:
          RELEASE_NOTES: ${{ steps.release.outputs.release_notes }}
          ACCEPTED_SHA256: ${{ steps.release.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n\nSHA-256: %s\n' "$RELEASE_NOTES" "$ACCEPTED_SHA256" > release-notes.md

      - name: Publish or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.release.outputs.tag }}'
          title='${{ steps.release.outputs.title }}'
          target_sha='${{ steps.release.outputs.source_sha }}'
          installed_name='${{ steps.release.outputs.installed_asset_name }}'
          asset="release-asset/$installed_name"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$target_sha" \
              --title "$title" \
              --notes-file release-notes.md

            gh release upload "$tag" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            while IFS= read -r old_asset; do
              if [ -n "$old_asset" ] && [ "$old_asset" != "$installed_name" ] && [[ "$old_asset" == *.dll ]]; then
                gh release delete-asset "$tag" "$old_asset" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          else
            gh release create "$tag" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$target_sha" \
              --title "$title" \
              --notes-file release-notes.md
          fi
